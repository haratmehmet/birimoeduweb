<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilgi Merkezi — Eğitim Yönetimi ve Rehberlik ve Yönetim Bilgileri | Birimo</title>
  <meta name="description" content="VIP kurslar, kolejler ve rehber öğretmenler için YKS/LGS öğrenci takibi, ders planlaması ve kurumsal eğitim yönetimi üzerine kapsamlı rehberler ve stratejik makaleler.">
  <meta name="keywords" content="bilgi merkezi, eğitim bilgileri, yks öğrenci takibi, lgs öğrenci takibi, rehberlik ödev takibi, vip kurs yönetimi, eğitim teknolojileri">
  <link rel="canonical" href="https://birimoedu.com/bilgi-merkezi.html">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  

  <!-- Initialize Lucide Icons -->
  <script>
    lucide.createIcons();
  </script>

  <!-- Interactive Category Filter for Bilgi Merkezi Cards -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const filterPills = document.querySelectorAll('.guide-filter-pill');
      const cards = document.querySelectorAll('.guide-card');

      filterPills.forEach(pill => {
        pill.addEventListener('click', function() {
          filterPills.forEach(p => {
            p.classList.remove('bg-brandNavy', 'text-white', 'active');
            p.classList.add('border', 'border-slate-200', 'bg-white', 'text-slate-600');
          });
          this.classList.remove('border', 'border-slate-200', 'bg-white', 'text-slate-600');
          this.classList.add('bg-brandNavy', 'text-white', 'active');

          const category = this.getAttribute('data-category');
          cards.forEach(card => {
            const cardCat = card.getAttribute('data-category') || '';
            const cats = cardCat.split(/\s+/);
            if (category === 'all' || cats.includes(category)) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          });
        });
      });
    });
  </script>

  <!-- Main Website Script -->
  <script src="js/main.js?v=20261108e"></script>
</body>
</html>
