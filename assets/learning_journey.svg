<svg viewBox="0 0 560 420" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto select-none pointer-events-none">
  <defs>
    <!-- Brand Route Gradients -->
    <linearGradient id="journeyRouteGradient" x1="60" y1="360" x2="460" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e284d" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#0e284d" />
      <stop offset="65%" stop-color="#fc4c39" />
      <stop offset="100%" stop-color="#e83926" />
    </linearGradient>

    <linearGradient id="journeyRouteAura" x1="60" y1="360" x2="460" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e284d" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#fc4c39" stop-opacity="0.16" />
    </linearGradient>

    <!-- Soft Node Glows -->
    <radialGradient id="journeyCoralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fc4c39" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fc4c39" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="journeyNavyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e284d" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0e284d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Minimal Geometric Reference Lines (Airy & Delicate) -->
  <g stroke-dasharray="4 6" stroke-width="0.8" opacity="0.35">
    <!-- Subtle Base Reference Horizon -->
    <line x1="50" y1="360" x2="510" y2="360" stroke="#94a3b8" />
    <!-- Milestone Vertical Alignment Guides -->
    <line x1="130" y1="285" x2="130" y2="360" stroke="#94a3b8" />
    <line x1="280" y1="185" x2="280" y2="360" stroke="#94a3b8" />
    <line x1="440" y1="80" x2="440" y2="360" stroke="#fc4c39" stroke-opacity="0.6" />
    <!-- Fine Trajectory Axis -->
    <line x1="50" y1="390" x2="490" y2="55" stroke="#38bdf8" stroke-opacity="0.35" />
  </g>

  <!-- Subtle Datum Coordinate Ticks -->
  <g stroke="#94a3b8" stroke-width="1" opacity="0.4">
    <line x1="127" y1="360" x2="133" y2="360" />
    <line x1="277" y1="360" x2="283" y2="360" />
    <line x1="437" y1="360" x2="443" y2="360" stroke="#fc4c39" />
  </g>

  <!-- 2. The Learning Journey Route (Smooth Ascending Curve) -->
  <!-- Ambient Trail Glow -->
  <path 
    d="M 60 360 C 100 350, 100 295, 130 285 C 170 270, 240 220, 280 185 C 330 145, 390 100, 440 80" 
    fill="none" 
    stroke="url(#journeyRouteAura)" 
    stroke-width="14" 
    stroke-linecap="round"
  />

  <!-- Primary Smooth Trajectory Path -->
  <path 
    d="M 60 360 C 100 350, 100 295, 130 285 C 170 270, 240 220, 280 185 C 330 145, 390 100, 440 80" 
    fill="none" 
    stroke="url(#journeyRouteGradient)" 
    stroke-width="2.6" 
    stroke-linecap="round"
  />

  <!-- Forward Projection Line (Extending Towards Future Achievement) -->
  <path 
    d="M 440 80 C 465 70, 490 62, 510 56" 
    fill="none" 
    stroke="#fc4c39" 
    stroke-width="1.8" 
    stroke-linecap="round" 
    stroke-dasharray="3 4" 
    opacity="0.6"
  />

  <!-- 3. Milestone 1: "Birebir Ders" (Foundation Point) -->
  <g transform="translate(130, 285)">
    <circle cx="0" cy="0" r="22" fill="url(#journeyNavyGlow)" />
    <circle cx="0" cy="0" r="9" stroke="#0e284d" stroke-width="1.8" fill="#ffffff" />
    <circle cx="0" cy="0" r="3.5" fill="#0e284d" />

    <g transform="translate(18, 5)">
      <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0e284d">Birebir Ders</text>
      <text y="14" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b">Kişisel Öğrenme Planı</text>
    </g>
  </g>

  <!-- 4. Milestone 2: "Rehberlik & Takip" (Guidance & Continuous Progress) -->
  <g transform="translate(280, 185)">
    <circle cx="0" cy="0" r="26" fill="url(#journeyNavyGlow)" />
    <circle cx="0" cy="0" r="11" stroke="#0e284d" stroke-width="1.8" fill="#ffffff" />
    <path d="M 0 -5 L 3.5 0 L 0 5 L -3.5 0 Z" fill="#fc4c39" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />

    <g transform="translate(-140, -10)">
      <text x="122" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0e284d" text-anchor="end">Rehberlik &amp; Takip</text>
      <text x="122" y="14" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="end">Gelişim ve Ödev Analizi</text>
    </g>
  </g>

  <!-- 5. Milestone 3: "Hedef & Başarı" (Summit Milestone) -->
  <g transform="translate(440, 80)">
    <circle cx="0" cy="0" r="34" fill="url(#journeyCoralGlow)" />
    <circle cx="0" cy="0" r="14" stroke="#fc4c39" stroke-width="2" fill="#ffffff" />
    
    <!-- Achievement Star Icon -->
    <path 
      d="M 0 -6.5 L 1.8 -1.8 L 6.5 -1.2 L 2.8 1.8 L 3.9 6.5 L 0 3.8 L -3.9 6.5 L -2.8 1.8 L -6.5 -1.2 L -1.8 -1.8 Z" 
      fill="#fc4c39"
    />

    <g transform="translate(-16, -26)">
      <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#fc4c39">Hedef &amp; Başarı</text>
      <text y="14" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0e284d">Sınav &amp; Derece Kazanımı</text>
    </g>
  </g>

  <!-- 6. Gentle Geometric Compass Rays from Goal (Subtle, Clean) -->
  <g stroke="#fc4c39" stroke-opacity="0.25" stroke-width="0.8">
    <line x1="440" y1="52" x2="440" y2="44" />
    <line x1="440" y1="108" x2="440" y2="116" />
    <line x1="412" y1="80" x2="404" y2="80" />
    <line x1="468" y1="80" x2="476" y2="80" />
    <line x1="420" y1="60" x2="415" y2="55" />
    <line x1="460" y1="100" x2="465" y2="105" />
    <line x1="460" y1="60" x2="465" y2="55" />
    <line x1="420" y1="100" x2="415" y2="105" />
  </g>
</svg>
