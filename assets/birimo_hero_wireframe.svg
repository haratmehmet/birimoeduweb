<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="100%" height="100%" fill="none" class="w-full h-auto select-none pointer-events-none">
  <defs>
    <!-- Seamless Radial Mask so all grid and construction lines fade softly into the dark background -->
    <radialGradient id="blueprintRadialFade" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="blueprintMask">
      <rect width="680" height="660" fill="url(#blueprintRadialFade)" />
    </mask>

    <!-- Technical Architectural Grid in Glowing Cyan/White -->
    <pattern id="cadGridMinor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.045" />
    </pattern>
    <pattern id="cadGridMajor" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="url(#cadGridMinor)" />
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>

    <!-- Subtle Luminous Glow Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Masked Content (Grid + Construction Axes + Logo Drawing) -->
  <g mask="url(#blueprintMask)">
    
    <!-- 1. Technical Grid Layer -->
    <rect width="680" height="660" fill="url(#cadGridMajor)" />

    <!-- 2. Architectural Construction & Projection Axes (Dashed) -->
    <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.75" stroke-dasharray="8 6">
      <!-- Horizontal Alignment Axes -->
      <line x1="20" y1="95" x2="660" y2="95" />
      <line x1="20" y1="175" x2="660" y2="175" />
      <line x1="20" y1="260" x2="660" y2="260" />
      <line x1="20" y1="410" x2="660" y2="410" stroke-opacity="0.25" />
      <line x1="20" y1="535" x2="660" y2="535" />

      <!-- Vertical Alignment Axes -->
      <line x1="160" y1="30" x2="160" y2="630" />
      <line x1="230" y1="30" x2="230" y2="630" />
      <line x1="285" y1="30" x2="285" y2="630" />
      <line x1="365" y1="30" x2="365" y2="630" stroke-opacity="0.25" />
      <line x1="415" y1="30" x2="415" y2="630" stroke-opacity="0.28" />
      <line x1="550" y1="30" x2="550" y2="630" />

      <!-- Isometric 30-degree Diagonal Projection Rays -->
      <line x1="60" y1="20" x2="620" y2="340" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="6 4" />
      <line x1="620" y1="20" x2="60" y2="340" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="6 4" />
      <line x1="120" y1="590" x2="600" y2="310" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="6 6" />
    </g>

    <!-- 3. Concentric Compass Rings for the 'b' Loop (Exact Drafting Compass Style) -->
    <g fill="none">
      <!-- Outer Compass Guideline Rays -->
      <circle cx="415" cy="410" r="165" stroke="#38bdf8" stroke-opacity="0.12" stroke-dasharray="4 4" stroke-width="0.75" />
      <circle cx="415" cy="410" r="148" stroke="#ffffff" stroke-opacity="0.2" stroke-dasharray="6 4" stroke-width="0.75" />
      
      <!-- Primary Concentric Contour Circles (Fine Compass Arcs) -->
      <circle cx="415" cy="410" r="135" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.6" filter="url(#subtleGlow)" />
      <circle cx="415" cy="410" r="126" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8" />
      <circle cx="415" cy="410" r="118" stroke="#a5f3fc" stroke-opacity="0.35" stroke-width="0.75" />
      <circle cx="415" cy="410" r="110" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8" />
      <circle cx="415" cy="410" r="102" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.75" />
      <circle cx="415" cy="410" r="94" stroke="#a5f3fc" stroke-opacity="0.35" stroke-width="0.75" />
      <circle cx="415" cy="410" r="86" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8" />
      <circle cx="415" cy="410" r="78" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8" />
      <circle cx="415" cy="410" r="70" stroke="#a5f3fc" stroke-opacity="0.5" stroke-width="0.9" />
      <circle cx="415" cy="410" r="62" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.6" filter="url(#subtleGlow)" />
      
      <!-- Inner Compass Guidance Circles -->
      <circle cx="415" cy="410" r="48" stroke="#ffffff" stroke-opacity="0.18" stroke-dasharray="4 3" stroke-width="0.75" />
      <circle cx="415" cy="410" r="32" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="0.75" />
    </g>

    <!-- 4. The Numeral '1' Stem & Base Structure -->
    <g fill="none">
      <!-- Outer Perimeter of '1' -->
      <path d="M 160 295 L 225 240 L 285 240 L 285 535 L 160 535 L 160 480 L 225 480 L 225 320 L 160 320 Z" 
            stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round" stroke-linecap="round" filter="url(#subtleGlow)" />

      <!-- Internal Fine Structural Wireframe Guidelines for '1' -->
      <line x1="245" y1="240" x2="245" y2="480" stroke="#a5f3fc" stroke-width="0.9" stroke-opacity="0.45" />
      <line x1="265" y1="240" x2="265" y2="535" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="5 3" />
      <line x1="195" y1="265" x2="195" y2="320" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.35" />
      
      <!-- Horizontal Internal Floor Rungs -->
      <line x1="225" y1="360" x2="285" y2="360" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.25" />
      <line x1="225" y1="410" x2="285" y2="410" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.4" />
      <line x1="160" y1="510" x2="285" y2="510" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.25" />

      <!-- Tangent Transitions Connecting '1' and 'b' -->
      <line x1="285" y1="275" x2="415" y2="275" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
      <line x1="285" y1="535" x2="415" y2="545" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
    </g>

    <!-- 5. Academic Graduation Mortarboard Cap (Crowning The Monogram) -->
    <g fill="none">
      <!-- Main Diamond Top Plate (Isometric Geometry) -->
      <polygon points="365,75 560,155 365,235 170,155" 
               stroke="#ffffff" stroke-width="2" stroke-opacity="0.95" stroke-linejoin="round" stroke-linecap="round" filter="url(#subtleGlow)" />

      <!-- Under-plate Depth/Bevel Wireframe -->
      <polygon points="365,85 560,165 365,245 170,165" 
               stroke="#a5f3fc" stroke-width="0.9" stroke-opacity="0.35" stroke-dasharray="4 3" stroke-linejoin="round" />
      <line x1="170" y1="155" x2="170" y2="165" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.75" />
      <line x1="365" y1="235" x2="365" y2="245" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.75" />
      <line x1="560" y1="155" x2="560" y2="165" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.75" />

      <!-- Center Button Pivot -->
      <ellipse cx="365" cy="155" rx="9" ry="5.5" stroke="#fc4c39" stroke-width="1.6" stroke-opacity="0.9" />
      <circle cx="365" cy="155" r="1.5" fill="#fc4c39" />

      <!-- Skull Cap Arch Underneath (Curved Arch) -->
      <path d="M 290 205 C 290 255, 440 255, 440 205" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.6" stroke-linejoin="round" />
      <path d="M 310 218 V 238 M 335 222 V 246 M 365 225 V 249 M 395 222 V 246 M 420 218 V 238" 
            stroke="#a5f3fc" stroke-width="0.8" stroke-opacity="0.3" />

      <!-- Academic Tassel (Swinging to Right) -->
      <path d="M 372 157 Q 490 185, 495 240" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.8" />
      <!-- Tassel Ring -->
      <circle cx="495" cy="245" r="3.5" stroke="#fc4c39" stroke-width="1.4" stroke-opacity="0.9" />
      <!-- Tassel Brush Lines -->
      <path d="M 492 249 L 485 295 M 495 249 L 495 297 M 498 249 L 505 295 M 488 295 L 502 295" 
            stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75" stroke-linecap="round" />
    </g>

    <!-- 6. Architectural Precision Crosshairs (+) at Key Geometric Intersections -->
    <g stroke="#fc4c39" stroke-width="1.4" stroke-opacity="0.85">
      <!-- Circle Origin Crosshair -->
      <path d="M 405 410 H 425 M 415 400 V 420" />
      <!-- Cap Apex Crosshair -->
      <path d="M 358 75 H 372 M 365 68 V 82" stroke="#38bdf8" />
      <!-- Serif Anchor Crosshair -->
      <path d="M 153 295 H 167 M 160 288 V 302" stroke="#38bdf8" />
      <!-- Right Cap Corner Crosshair -->
      <path d="M 553 155 H 567 M 560 148 V 162" stroke="#38bdf8" />
      <!-- Base Origin Crosshair -->
      <path d="M 153 535 H 167 M 160 528 V 542" stroke="#fc4c39" />
    </g>

    <!-- 7. Architectural Tick Coordinates (Clean, Subtle Vector Ticks, No Clunky Text) -->
    <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.75">
      <path d="M 158 531 H 162 M 158 539 H 162 M 283 531 H 287 M 283 539 H 287" />
      <path d="M 411 273 V 277 M 419 273 V 277 M 411 543 V 547 M 419 543 V 547" />
    </g>

  </g>
</svg>
