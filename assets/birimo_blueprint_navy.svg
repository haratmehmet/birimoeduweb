<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="100%" fill="none" class="w-full h-auto select-none pointer-events-none">
  <defs>
    <!-- Soft Radial Fade Mask so grid fades seamlessly into white background -->
    <radialGradient id="fadeMaskGrad" cx="50%" cy="52%" r="52%" fx="50%" fy="52%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="60%" stop-color="#fff" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#fff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="softFadeMask">
      <rect width="640" height="640" fill="url(#fadeMaskGrad)" />
    </mask>

    <!-- CAD Technical Grid Pattern in Birimo Navy -->
    <pattern id="cadGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0e284d" stroke-width="0.5" stroke-opacity="0.09" />
      <circle cx="0" cy="0" r="1" fill="#0e284d" fill-opacity="0.18" />
    </pattern>
    <pattern id="cadMajorGrid" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="url(#cadGrid)" />
      <path d="M 128 0 L 0 0 0 128" fill="none" stroke="#0e284d" stroke-width="1" stroke-opacity="0.16" />
    </pattern>
    
    <!-- Hatching Pattern for the '1' -->
    <pattern id="cadHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0e284d" stroke-width="0.8" stroke-opacity="0.16" />
    </pattern>
    
    <!-- Dot Matrix Pattern for 'b' loop -->
    <pattern id="cadDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#0e284d" fill-opacity="0.18" />
    </pattern>
    
    <!-- Arrow Markers -->
    <marker id="arrowNavy" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L2,3 Z" fill="#0e284d" fill-opacity="0.75" />
    </marker>
    <marker id="arrowCoral" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L2,3 Z" fill="#fc4c39" fill-opacity="0.9" />
    </marker>
  </defs>

  <!-- Seamless Fading Background CAD Grid (Masked) -->
  <g mask="url(#softFadeMask)">
    <rect width="640" height="640" fill="url(#cadMajorGrid)" />
    
    <!-- Infinite Construction Axes -->
    <g stroke="#0e284d" stroke-opacity="0.22" stroke-dasharray="8 4" stroke-width="0.75">
      <line x1="20" y1="390" x2="620" y2="390" />
      <line x1="370" y1="20" x2="370" y2="620" />
      <line x1="240" y1="20" x2="240" y2="620" />
      <line x1="160" y1="80" x2="160" y2="600" />
      <line x1="40" y1="110" x2="600" y2="110" />
      <line x1="40" y1="510" x2="600" y2="510" />
      <line x1="100" y1="620" x2="600" y2="120" stroke-opacity="0.15" />
    </g>
  </g>

  <!-- Concentric Drafting Circles for 'b' Loop (CAD Compass Arcs) -->
  <g stroke="#0e284d" fill="none">
    <circle cx="370" cy="390" r="165" stroke-opacity="0.1" stroke-dasharray="4 3" stroke-width="0.75" />
    <circle cx="370" cy="390" r="150" stroke-opacity="0.2" stroke-dasharray="6 3" stroke-width="1" />
    <circle cx="370" cy="390" r="135" stroke-opacity="0.35" stroke-width="1.2" />
    <!-- Inner concentric guidelines -->
    <circle cx="370" cy="390" r="115" stroke-opacity="0.15" stroke-dasharray="4 2" stroke-width="0.75" />
    <circle cx="370" cy="390" r="95" stroke-opacity="0.2" stroke-width="0.75" />
    <circle cx="370" cy="390" r="68" stroke-opacity="0.3" stroke-dasharray="6 3" stroke-width="1" />
    <circle cx="370" cy="390" r="48" stroke-opacity="0.12" stroke-width="0.75" />
    <!-- Center Pivot Point (+) -->
    <path d="M360 390 H380 M370 380 V400" stroke="#fc4c39" stroke-width="1.8" stroke-opacity="0.9" />
  </g>

  <!-- =========================================================================
       THE MAIN EMBLEM (BIRIMO 1b + CAP) IN SIGNATURE NAVY (#0e284d)
       ========================================================================= -->

  <!-- 1. The 'b' Loop Outer Ring Body with Dot Matrix -->
  <path d="M 370 255 A 135 135 0 1 1 235 390 L 235 255 Z" fill="url(#cadDots)" />

  <!-- 2. The '1' Stem & Base Fill with Technical Hatching -->
  <path d="M 160 270 L 225 210 L 285 210 L 285 510 L 160 510 L 160 450 L 225 450 L 225 270 Z" fill="url(#cadHatch)" />

  <!-- 3. Contour Lines for The Number '1' -->
  <g stroke="#0e284d" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Outer boundary of '1' -->
    <path d="M 160 270 L 225 210 L 285 210 L 285 310" />
    <path d="M 160 270 L 160 310 L 225 310 L 225 450 L 160 450 L 160 510 L 285 510" />
    <!-- Internal structural centerline -->
    <line x1="255" y1="210" x2="255" y2="510" stroke="#0e284d" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 2" />
  </g>

  <!-- 4. Contour Lines for The Letter 'b' Loop -->
  <g stroke="#0e284d" stroke-width="3" fill="none" stroke-linejoin="round">
    <!-- Outer Circle of 'b' -->
    <circle cx="370" cy="390" r="135" stroke-opacity="0.95" />
    <!-- Inner Cutout Circle of 'b' -->
    <circle cx="370" cy="390" r="68" stroke-opacity="0.95" stroke-width="2.8" />
    <!-- Tangent blend with stem -->
    <path d="M 285 255 L 370 255" stroke-width="2.2" stroke-opacity="0.6" />
    <path d="M 285 510 L 370 525" stroke-width="2.2" stroke-opacity="0.6" />
  </g>

  <!-- 5. Graduation Cap (Mortarboard) -->
  <g stroke="#0e284d" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Diamond Top Plate -->
    <polygon points="310,75 495,155 310,230 130,150" stroke-width="3.2" stroke-opacity="0.95" />
    
    <!-- Cap Thickness Rim (Isometric Bevel) -->
    <polygon points="310,85 495,165 310,240 130,160" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 2" />
    <line x1="495" y1="155" x2="495" y2="165" stroke-width="2" />
    <line x1="310" y1="230" x2="310" y2="240" stroke-width="2" />
    <line x1="130" y1="150" x2="130" y2="160" stroke-width="2" />

    <!-- Skull Cap Underneath (Arch) -->
    <path d="M 250 205 C 250 252, 370 252, 370 205" stroke-width="2" stroke-opacity="0.8" />
    <!-- Skull Cap Vertical Hatching -->
    <path d="M 270 215 V 238 M 290 220 V 244 M 310 222 V 246 M 330 220 V 244 M 350 215 V 238" stroke-width="1" stroke-opacity="0.35" />

    <!-- Center Button -->
    <ellipse cx="310" cy="152" rx="10" ry="6" stroke-width="2" stroke="#fc4c39" fill="#fff" fill-opacity="0.95" />

    <!-- Tassel String and Brush -->
    <path d="M 318 155 Q 430 185, 435 240" stroke="#0e284d" stroke-width="2" stroke-opacity="0.85" />
    <!-- Tassel Ring -->
    <circle cx="435" cy="245" r="4" stroke="#fc4c39" stroke-width="1.8" />
    <!-- Tassel Brush -->
    <path d="M 432 249 L 426 290 L 444 290 L 438 249 Z" stroke-width="1.6" stroke-opacity="0.9" fill="#0e284d" fill-opacity="0.06" />
    <line x1="430" y1="290" x2="430" y2="252" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="435" y1="290" x2="435" y2="252" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="440" y1="290" x2="440" y2="252" stroke-width="0.8" stroke-opacity="0.5" />
  </g>

  <!-- =========================================================================
       CAD MEASUREMENT ANNOTATIONS, ANGLES & DIMENSION CALLOUTS
       ========================================================================= -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">
    
    <!-- 30 deg Cap Angle Callout (Top Left) -->
    <path d="M 175 130 A 60 60 0 0 1 230 100" stroke="#fc4c39" stroke-width="1.2" fill="none" marker-end="url(#arrowCoral)" />
    <text x="180" y="90" fill="#fc4c39">30.0°</text>

    <!-- 30 deg Cap Right Angle Callout -->
    <path d="M 420 120 A 70 70 0 0 1 450 140" stroke="#0e284d" stroke-width="1" stroke-opacity="0.65" fill="none" marker-end="url(#arrowNavy)" />
    <text x="455" y="115" fill="#0e284d" fill-opacity="0.8">30.0°</text>

    <!-- Radius Dimension Line for 'b' Loop -->
    <line x1="370" y1="390" x2="465" y2="295" stroke="#fc4c39" stroke-width="1.2" stroke-opacity="0.85" marker-end="url(#arrowCoral)" />
    <text x="420" y="335" fill="#fc4c39" transform="rotate(-45 420 335)">R = 135 mm</text>

    <!-- Inner Diameter Dimension -->
    <line x1="322" y1="438" x2="418" y2="342" stroke="#0e284d" stroke-width="1" stroke-opacity="0.65" marker-start="url(#arrowNavy)" marker-end="url(#arrowNavy)" />
    <text x="345" y="405" fill="#0e284d" fill-opacity="0.75" transform="rotate(-45 345 405)">Ø = 136 mm</text>

    <!-- 90 deg Angle at Base -->
    <path d="M 190 510 A 30 30 0 0 1 160 480" stroke="#fc4c39" stroke-width="1.2" fill="none" />
    <circle cx="178" cy="492" r="1.5" fill="#fc4c39" />
    <text x="195" y="495" fill="#fc4c39">90°</text>

    <!-- Height Dimension Line (Left Side) -->
    <g stroke="#0e284d" stroke-opacity="0.5" stroke-width="1">
      <line x1="100" y1="210" x2="100" y2="510" marker-start="url(#arrowNavy)" marker-end="url(#arrowNavy)" />
      <line x1="90" y1="210" x2="160" y2="210" />
      <line x1="90" y1="510" x2="160" y2="510" />
    </g>
    <text x="75" y="365" fill="#0e284d" fill-opacity="0.75" transform="rotate(-90 75 365)">H = 300 mm</text>

    <!-- Width Dimension Line (Bottom) -->
    <g stroke="#0e284d" stroke-opacity="0.5" stroke-width="1">
      <line x1="160" y1="550" x2="505" y2="550" marker-start="url(#arrowNavy)" marker-end="url(#arrowNavy)" />
      <line x1="160" y1="510" x2="160" y2="560" />
      <line x1="505" y1="510" x2="505" y2="560" />
    </g>
    <text x="290" y="570" fill="#0e284d" fill-opacity="0.75">W = 345 mm [CAD: 1:1]</text>

    <!-- Technical Registration Crosshairs & Labels -->
    <text x="135" y="295" fill="#0e284d" fill-opacity="0.55">CL</text>
    <text x="245" y="295" fill="#0e284d" fill-opacity="0.55">CL</text>
    <text x="245" y="530" fill="#0e284d" fill-opacity="0.55">REF: 0,0</text>
    <text x="490" y="395" fill="#fc4c39" fill-opacity="0.9">Point(3.14, R)</text>
    <text x="475" y="460" fill="#0e284d" fill-opacity="0.55">TANGENT // 25°</text>

    <!-- Corner Alignment Crosshairs (+) -->
    <path d="M 20 20 H 35 M 27.5 12.5 V 27.5" stroke="#0e284d" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 605 20 H 620 M 612.5 12.5 V 27.5" stroke="#0e284d" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 20 620 H 35 M 27.5 612.5 V 627.5" stroke="#0e284d" stroke-opacity="0.35" stroke-width="1.5" />
    <path d="M 605 620 H 620 M 612.5 612.5 V 627.5" stroke="#0e284d" stroke-opacity="0.35" stroke-width="1.5" />
  </g>
</svg>