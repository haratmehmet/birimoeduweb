<head>

  <!-- Initialize Lucide Icons -->
  <script>
    lucide.createIcons();

  <!-- Main Website Script -->
  <script src="../../js/main.js?v=20261108e"></script>
  <!-- Share & Notification Script (Embedded for Instant Availability & No Cache Issue) -->
  <script>
    function copyArticleShareLink(btn) {
      try {
        var url = window.location.href;
        
        // 1. Copy to clipboard
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).catch(function() {
            fallbackCopyText(url);
          });
        } else {
          fallbackCopyText(url);
        }

        // 2. Button in-place feedback
        if (btn) {
          var originalHtml = btn.innerHTML;
          btn.innerHTML = '<svg class="w-3.5 h-3.5 text-[#12305b] inline shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg> <span class="text-[#12305b] font-bold">Kopyalandı!</span>';
          btn.classList.add('border-[#12305b]/40', 'bg-slate-50');
          setTimeout(function() {
            btn.innerHTML = originalHtml;
            btn.classList.remove('border-[#12305b]/40', 'bg-slate-50');
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
              window.lucide.createIcons();
            }
          }, 2500);
        }

        // 3. Show luxury toast notification
        showShareToast();
      } catch (err) {
        console.error('Share error:', err);
      }
    }

    function fallbackCopyText(text) {
      var textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      textArea.style.top = "-9999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
      } catch (e) {}
      document.body.removeChild(textArea);
    }

    function showShareToast() {
      var toast = document.getElementById('shareToastNotification');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'shareToastNotification';
        document.body.appendChild(toast);
      }

      toast.className = 'fixed bottom-6 left-4 right-4 sm:left-auto sm:right-6 max-w-sm sm:max-w-md bg-[#12305b] text-white p-3.5 sm:p-4 rounded-2xl shadow-2xl border border-white/20 flex items-center gap-3 transition-all duration-300';
      toast.style.zIndex = '999999';
      toast.style.position = 'fixed';
      toast.style.pointerEvents = 'auto';

      toast.innerHTML = '<div class="w-9 h-9 rounded-xl bg-[#fc4c39] text-white flex items-center justify-center shrink-0 shadow-xs">' +
        '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>' +
        '</div>' +
        '<div class="flex-1 min-w-0 pr-1">' +
        '<div class="font-extrabold text-xs sm:text-sm text-white flex items-center gap-1.5">' +
        '<span>Bağlantı Kopyalandı</span>' +
        '<span class="w-1.5 h-1.5 rounded-full bg-[#fc4c39] animate-pulse"></span>' +
        '</div>' +
        '<p class="text-[11px] text-blue-100 mt-0.5 leading-snug">Bu bilgi sayfasının bağlantısı panonuza kopyalandı. Dilediğiniz kişiyle paylaşabilirsiniz.</p>' +
        '</div>' +
        '<button type="button" onclick="hideShareToast()" class="text-white/70 hover:text-white p-1 text-sm font-bold cursor-pointer transition-colors shrink-0">✕</button>';

      toast.style.display = 'flex';
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(20px)';
      
      setTimeout(function() {
        toast.style.opacity = '1';
        toast.style.transform = 'translateY(0)';
      }, 15);

      if (window.shareToastTimer) clearTimeout(window.shareToastTimer);
      window.shareToastTimer = setTimeout(function() {
        hideShareToast();
      }, 3500);
    }

    function hideShareToast() {
      var toast = document.getElementById('shareToastNotification');
      if (toast) {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(20px)';
        setTimeout(function() {
          toast.style.display = 'none';
        }, 300);
      }
    }

    window.copyArticleShareLink = copyArticleShareLink;
    window.showShareToast = showShareToast;
    window.hideShareToast = hideShareToast;
  </script>

</body>
</html>
